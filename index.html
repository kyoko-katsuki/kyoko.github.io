<html lang="es">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Para tu ♡</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f7a8c4;
      font-family: Georgia, serif;
      color: #7b3f58;
      padding: 25px 15px;
    }

    .contenedor {
      max-width: 900px;
      margin: auto;
      background: #ffdce8;
      border: 2px solid #f4b6cc;
      border-radius: 18px;
      padding: 25px;
      box-shadow: 0 8px 20px rgba(100, 40, 70, .18);
    }

    .titulo {
      text-align: center;
      font-style: italic;
      font-size: 30px;
      margin-bottom: 25px;
    }

    .contenido {
      display: grid;
      grid-template-columns: 1fr 1.4fr;
      gap: 25px;
    }

    .tarjeta {
      background: #ffeaf1;
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 7px 15px rgba(100, 40, 70, .18);
      text-align: center;
    }

    .tarjeta h2 {
      margin-top: 0;
      font-size: 22px;
      font-style: italic;
    }

    .flores {
      height: 280px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 75px;
      line-height: 1.3;
    }

    .mensaje {
      font-size: 18px;
      line-height: 1.7;
      padding: 15px;
    }

    .boton {
      display: block;
      width: 180px;
      margin: 25px auto 0;
      padding: 12px;
      background: #f36fa0;
      color: white;
      text-decoration: none;
      border-radius: 15px;
      font-weight: bold;
      text-align: center;
      box-shadow: 0 5px 10px rgba(100, 40, 70, .2);
    }

    .boton:hover {
      transform: scale(1.04);
    }

    .decoracion {
      text-align: center;
      font-size: 25px;
      margin-bottom: 10px;
    }
