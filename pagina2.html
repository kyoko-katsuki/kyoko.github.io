<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Un pequeño recordatorio ♡</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f7a8c4;
      font-family: Georgia, serif;
      color: #7b3f58;
      padding: 25px 15px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .contenedor {
      max-width: 700px;
      width: 100%;
      background: #ffdce8;
      border: 2px solid #f4b6cc;
      border-radius: 20px;
      padding: 35px 25px;
      box-shadow: 0 8px 20px rgba(100, 40, 70, .18);
      text-align: center;
    }

    .decoracion {
      font-size: 28px;
      margin-bottom: 15px;
    }

    h1 {
      font-size: 30px;
      font-style: italic;
      margin-bottom: 25px;
    }

    .mensaje {
      background: #ffeaf1;
      border-radius: 18px;
      padding: 25px;
      box-shadow: 0 7px 15px rgba(100, 40, 70, .12);
      font-size: 18px;
      line-height: 1.7;
    }

    .frase {
      margin: 20px 0;
    }

    .corazon {
      font-size: 35px;
      margin: 20px 0;
    }

    .boton {
      display: block;
      width: 180px;
      margin: 25px auto 0;
      padding: 12px;
      background: #f36fa0;
      color: white;
      text-decoration: none;
      border-radius: 15px;
      font-weight: bold;
      box-shadow: 0 5px 10px rgba(100, 40, 70, .2);
    }

    .boton:hover {
      transform: scale(1.04);
    }
  </style>
</head>

<body>

  <div class="contenedor">

    <div class="decoracion">
      ♡ ୨୧ ♡
    </div>

    <h1>Just a little reminder ♡</h1>

    <div class="mensaje">

      <p class="frase">
        Solo quería recordarte algo...
      </p>

      <p class="frase">
        Te quiero muchísimo ♡
      </p>

      <p class="frase">
        Gracias por estar siempre, por hacerme sonreír
        y por ser una persona tan especial para mí.
      </p>

      <div class="corazon">
        🌷 ♡ 🌷
      </div>

      <p class="frase">
        solo queria decir:
        <br>
        <strong>te quiero mucho🐁🤍</strong>
      </p>

    </div>

    <a class="boton" href="index.html">
      BACK ♡
    </a>

  </div>

</body>
</html>
